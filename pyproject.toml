[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeroflow"
version = "0.0.1"
description = "Small-airport observation simulation (BTV)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5",
    "Faker>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
aeroflow = "aeroflow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aeroflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
